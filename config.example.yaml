# 翻译工具配置示例
# 复制为 %LOCALAPPDATA%\TranslatorBot\config.yaml 后按需修改

version: 0.0.1-rc.3

models:
  - id: deepseek
    name: DeepSeek
    base_url: https://api.deepseek.com/v1
    api_key: sk-xxxxxxxxxxxxxxxxxxxxxxxx
    model: deepseek-chat
    kind: text
    default: true

languages:
  mine: zh
  partners: [ko, ja, en]

features:
  bilingual: true
  copy_block: true
  glossary: true
  context: true
  cache: true
  auto_detect: true
  max_input_chars: 6000
  history_size: 3
  default_tone: natural

prompts:
  translation: ""
  explain: ""

update:
  mode: auto          # auto | direct | custom
  custom_proxy: ""

app:
  close_to_tray: true
  autostart_bot: false
  check_update_on_start: true

proxy: ""
