name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build host and NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-host.ps1 -Msvc

      - name: Assemble release files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $setup = Get-ChildItem "dist\*_x64-setup.exe" | Where-Object { $_.Name -like "*_$version`_x64-setup.exe" } | Select-Object -First 1
          if (-not $setup) { throw "没有找到本版本（$version）的 NSIS 安装包" }

          Copy-Item $setup.FullName "dist\TranslatorBot-Setup-$version.exe" -Force

          # 用 CI 私钥对最终要上传的文件重新签名，确保签名与文件、版本三者一致
          $keyPath = Join-Path $env:RUNNER_TEMP "updater.key"
          Set-Content -Path $keyPath -Value $env:TAURI_SIGNING_PRIVATE_KEY -NoNewline
          cargo tauri signer sign -f $keyPath -p $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD "dist\TranslatorBot-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw "重新签名失败" }
          $signature = (Get-Content "dist\TranslatorBot-Setup-$version.exe.sig" -Raw).Trim()
          $sigText = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($signature))
          if ($sigText -notmatch [regex]::Escape($version)) { throw "签名版本校验失败：$version" }

          $latest = @{
            version = $version
            notes = "v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/leoyangx/translator-bot/releases/download/${{ github.ref_name }}/TranslatorBot-Setup-$version.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "dist\latest.json" -Encoding utf8

          # 绿色版 zip（单文件）
          Compress-Archive -Path "dist\TranslatorBot\TranslatorBot.exe" -DestinationPath "dist\TranslatorBot-v$version-win64.zip" -Force

          $lines = @()
          foreach ($f in @("dist\TranslatorBot-Setup-$version.exe", "dist\TranslatorBot-v$version-win64.zip")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content "dist\checksums.txt" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TranslatorBot-Setup-*.exe
            dist/TranslatorBot-v*-win64.zip
            dist/latest.json
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
