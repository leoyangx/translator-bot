name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build host and NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-host.ps1 -Msvc

      - name: Assemble release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $setup = Get-ChildItem "dist\*_x64-setup.exe" | Where-Object { $_.Name -like "*_$version`_x64-setup.exe" } | Select-Object -First 1
          if (-not $setup) { throw "没有找到本版本（$version）的 NSIS 安装包" }
          $sig = "$($setup.FullName).sig"
          if (-not (Test-Path $sig)) { throw "没有找到签名文件" }
          $sigText = (Get-Content $sig -Raw).Trim()
          if ($sigText -notmatch [regex]::Escape($version)) {
            throw "签名文件与版本不匹配：期望 $version，实际签名内容不含该版本号"
          }

          Copy-Item $setup.FullName "dist\TranslatorBot-Setup-$version.exe" -Force
          $signature = $sigText

          # 便携版：单文件 exe
          Copy-Item "dist\TranslatorBot\TranslatorBot.exe" "dist\TranslatorBot-portable.exe" -Force

          $latest = @{
            version = $version
            notes = "v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/leoyangx/translator-bot/releases/download/${{ github.ref_name }}/TranslatorBot-Setup-$version.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "dist\latest.json" -Encoding utf8

          # 绿色版 zip（单文件）
          Compress-Archive -Path "dist\TranslatorBot\TranslatorBot.exe" -DestinationPath "dist\TranslatorBot-v$version-win64.zip" -Force

          $lines = @()
          foreach ($f in @("dist\TranslatorBot-Setup-$version.exe", "dist\TranslatorBot-v$version-win64.zip")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content "dist\checksums.txt" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TranslatorBot-Setup-*.exe
            dist/TranslatorBot-v*-win64.zip
            dist/latest.json
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
