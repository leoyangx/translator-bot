name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build backend
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name TranslatorBotBackend
          --add-data "app/console/web;app/console/web"
          --add-data "assets;assets"
          --collect-all langdetect
          run.py

      - name: Build updater
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name updater --distpath dist updater_entry.py

      - name: Ensure Rust (MSVC toolchain, preinstalled on windows-latest)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Build Rust host
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-host.ps1 -Msvc

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\build-installer.ps1 -Version $version
          $msi = Get-ChildItem "dist\TranslatorBot-Setup-*.msi" | Select-Object -First 1
          if (-not $msi) { throw "没有生成 MSI" }
          Write-Host "MSI: $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"

      - name: Create portable zip
        shell: python
        run: |
          import hashlib, os, zipfile
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          target = Path(f"dist/TranslatorBot-v{version}-win64.zip")
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              z.write("dist/TranslatorBot/TranslatorBot.exe", "TranslatorBot.exe")
              backend = Path("dist/TranslatorBotBackend")
              for p in sorted(backend.rglob("*")):
                  if p.is_file():
                      z.write(p, ("backend/" + p.relative_to(backend).as_posix()))
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path("dist/zip.sha256").write_text(f"{digest}  {target.name}\n", encoding="ascii")

      - name: Write checksums
        shell: pwsh
        run: |
          $lines = @(Get-Content "dist\zip.sha256")
          $msi = Get-ChildItem "dist\TranslatorBot-Setup-*.msi" | Select-Object -First 1
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          $lines += "$hash  $($msi.Name)"
          $lines | Set-Content -Path "dist/checksums.txt" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.msi
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
